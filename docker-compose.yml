# Local development dependencies. The API and web app run on the host (see docs/DEVELOPMENT.md).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for LOCAL DEVELOPMENT only (SeaweedFS). Not needed before Phase 3 (attachments), so opt-in:
  # `docker compose --profile storage up -d`. The application only knows "an S3-compatible endpoint" (never SeaweedFS-specific APIs);
  # production storage is deployment-configurable (D-17).
  objectstore:
    profiles: [storage]
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=256
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes: ["objectdata:/data"]

volumes:
  pgdata:
  objectdata:
