name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Integration tests create a uniquely named database per test fixture on this server (throwaway CI credentials).
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk_ci
          POSTGRES_DB: helpdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HELPDESK_TEST_DB: Host=localhost;Port=5432;Username=helpdesk;Password=helpdesk_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: dotnet build Helpdesk.slnx -c Release
      - run: dotnet test Helpdesk.slnx -c Release --no-build
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: src/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
