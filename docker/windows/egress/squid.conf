# Outbound allowlist for the application: only the Microsoft sign-in and Graph endpoints, HTTPS (CONNECT) on 443, nothing else.
http_port 3128
acl microsoft dstdomain login.microsoftonline.com graph.microsoft.com
acl tls_port port 443
acl connect_method method CONNECT
http_access deny !connect_method
http_access deny !tls_port
http_access allow microsoft
http_access deny all
# No caching, no logging of request contents: only access lines (host, status) to stdout.
cache deny all
access_log stdio:/dev/stdout
cache_log /dev/null
pid_filename /tmp/squid.pid
