# Optional overlay: mounts ONE folder of secret files (PFX certificates and password files) read-only into the application and the migrate run, from OUTSIDE the
# repository and the image. Enabled by scripts/windows/helpdesk.ps1 when SECRETS_DIR is set. Inside the container the folder is /run/helpdesk-secrets, so for example
# DP_CERT_PATH=/run/helpdesk-secrets/dp.pfx and GRAPH_CERT_PATH=/run/helpdesk-secrets/graph.pfx.
services:
  helpdesk:
    volumes:
      - type: bind
        source: ${SECRETS_DIR}
        target: /run/helpdesk-secrets
        read_only: true
  migrate:
    volumes:
      - type: bind
        source: ${SECRETS_DIR}
        target: /run/helpdesk-secrets
        read_only: true
