# Reference Nginx configuration for Helpdesk (ADR-020). Nginx terminates TLS and proxies HTTP and WebSockets to the application,
# which serves the SPA, the API and SignalR and owns every application response security header (CSP, framing, nosniff, referrer).
# Do NOT add application security headers here: one owner, no conflicting policies.
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Attachments are limited by the application (Attachments:MaxBytes, 25 MiB per file); this only has to be larger than the biggest request.
    client_max_body_size 40m;

    location / {
        proxy_pass http://helpdesk:8080;
        proxy_http_version 1.1;

        # The application trusts these only from this proxy's address (Proxy:KnownProxies). Overwrite, never pass a client-supplied value through.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SignalR WebSockets.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
