# Reference production topology (ADR-020): ONE Helpdesk application container (SPA + API + SignalR + background jobs), PostgreSQL and the Nginx proxy.
# A single application instance is the supported topology (ADR-021). Object storage is external and S3-compatible (any provider).
# Usage: copy .env.example to .env and fill it in, put TLS files in ./tls, then
#   docker compose -f docker/production/compose.yml --env-file docker/production/.env build
#   docker compose -f docker/production/compose.yml --env-file docker/production/.env run --rm migrate
#   docker compose -f docker/production/compose.yml --env-file docker/production/.env up -d
# Migration order and rollback (restore from backup) are in docs/guides/PRODUCTION_DEPLOYMENT.md.
# The project name names every volume and network (<name>_pgdata, <name>_internal). The default `helpdesk` is also the name of the LOCAL DEVELOPMENT compose
# project, so running this file on a developer machine with the default name would attach the development database volume. A staging or second environment
# MUST run under its own project name (COMPOSE_PROJECT_NAME in its env file, or scripts/ops/staging.sh, which fixes it) and its own PROXY_IP / INTERNAL_SUBNET.
name: ${COMPOSE_PROJECT_NAME:-helpdesk}

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  helpdesk: &app
    build:
      context: ../..
      dockerfile: docker/host.Dockerfile
    image: helpdesk-host:${HELPDESK_VERSION:-local}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment: &app-env
      ASPNETCORE_ENVIRONMENT: Production
      Database__ConnectionString: Host=postgres;Database=helpdesk;Username=helpdesk;Password=${POSTGRES_PASSWORD}
      AllowedHosts: ${PUBLIC_HOST:?set in .env}
      # PUBLIC_PORT_SUFFIX (for example :8443) is only for hosts that publish HTTPS on a non-standard port; empty by default.
      Realtime__AllowedOrigins__0: https://${PUBLIC_HOST}${PUBLIC_PORT_SUFFIX:-}
      # Forwarded headers are trusted from the proxy's fixed address only.
      Proxy__KnownProxies__0: ${PROXY_IP:-172.29.0.10}
      Authentication__Entra__TenantId: ${ENTRA_TENANT_ID:?set in .env}
      Authentication__Entra__ClientId: ${ENTRA_CLIENT_ID:?set in .env}
      Authentication__Entra__ClientSecret: ${ENTRA_CLIENT_SECRET:?set in .env}
      Authentication__BootstrapPlatformAdminSubjects__0: ${BOOTSTRAP_PLATFORM_ADMIN_SUBJECT:?set in .env}
      Mail__Provider: Graph
      Mail__NotificationBaseUrl: https://${PUBLIC_HOST}${PUBLIC_PORT_SUFFIX:-}
      Mail__Graph__TenantId: ${GRAPH_TENANT_ID:?set in .env}
      Mail__Graph__ClientId: ${GRAPH_CLIENT_ID:?set in .env}
      Mail__Graph__ClientSecret: ${GRAPH_CLIENT_SECRET:?set in .env}
      Storage__Provider: S3
      Storage__S3__Endpoint: ${S3_ENDPOINT:?set in .env}
      Storage__S3__Bucket: ${S3_BUCKET:-helpdesk}
      Storage__S3__AccessKey: ${S3_ACCESS_KEY:?set in .env}
      Storage__S3__SecretKey: ${S3_SECRET_KEY:?set in .env}
      Attachments__RequireCleanScan: "true"
      # Off until a malware scanning engine is integrated (D-08); the host refuses to start with it on.
      Attachments__Enabled: "false"
    networks: [internal]

  # One-off: `run --rm migrate`. Applies every module migration in the registered order, then exits.
  migrate:
    <<: *app
    profiles: [migrate]
    restart: "no"
    command: ["migrate"]

  nginx:
    image: nginx:1.29.8-alpine
    restart: unless-stopped
    depends_on: [helpdesk]
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:-./tls}:/etc/nginx/tls:ro
    networks:
      internal:
        ipv4_address: ${PROXY_IP:-172.29.0.10}

networks:
  internal:
    ipam:
      config: [{ subnet: "${INTERNAL_SUBNET:-172.29.0.0/24}" }]

volumes:
  pgdata:
